# Runtime dependencies of the Vercel function only. The science stack stays in requirements*.txt.
[project]
name = "samanvay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "numpy",
]

[tool.vercel.scripts]
build = "cd web && npm ci && npm run build"
